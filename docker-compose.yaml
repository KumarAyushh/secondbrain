services:
  postgres:
    image: postgres:17-alpine
    container_name: secondbrain-postgres

    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: secondbrain_dev
      POSTGRES_DB: secondbrain

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: